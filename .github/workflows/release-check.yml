name: UEFI Config Check
#
# CI check: verify that the uefi-rodin scaffold (device + soc + firmware)
# can be fully resolved by the UniXNU toolchain.
# This check runs the release chain up to the patch plan (defconfig,
# module resolution, patch order) without fetching sources or the IPSW and
# without attempting any build step, so it fast-paths validation.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

env:
  UNIXNU_DEVICE: ${{ github.workspace }}/UniXNU-rodin
  SOC_MODULE: soc:mt6899=${{ github.workspace }}/UniXNU-mt6899-common

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout device repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/UniXNU-rodin
          path: UniXNU-rodin

      - name: Checkout UniXNU
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          path: UniXNU

      - name: Checkout UniXNU mt6899 common soc
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/UniXNU-mt6899-common
          path: UniXNU-mt6899-common

      - name: Checkout uefi-rodin scaffold
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/uefi-rodin
          path: uefi-rodin

      - name: Initialize XnuPrelink kit submodule (patch-series check)
        run: |
          cd UniXNU
          git submodule update --init kits/XnuPrelink

      - name: Make unixnu executable
        run: chmod +x UniXNU/unixnu

      - name: Resolver release (defconfig/modules/patches, no build)
        run: |
          cd UniXNU
          set -o pipefail
          # --no-deps skips the source + IPSW fetch (which needs the Linux
          # toolchain's lzfse); --check stops after defconfig, module
          # resolution and the patch plan, before any build step.
          ./unixnu release --no-deps --check -D "$UNIXNU_DEVICE" --local-module "$SOC_MODULE" 2>&1 | tee release.log
          rc=${PIPESTATUS[0]}
          echo "release exit code: $rc"
          test "$rc" -eq 0

      - name: Upload release log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uefi-release-log
          path: |
            UniXNU/release.log
            uefi-rodin/release.log
            uefi-rodin/board.toml
            uefi-rodin/src/main.c
            uefi-rodin/dts/rodin.dts
          if-no-files-found: warn
