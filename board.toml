# UEFI firmware configuration for rodin (Redmi Turbo 4 / POCO X7 Pro)
# SoC: MediaTek Dimensity 8400-Ultra (MT6899, aarch64)
# This file is read by the Mu-Silicium / UniXNU build system.

[board]
name = "rodin"
soc = "mt6899"
os_profile = "ipados-17.7.11-21H461"  # arm64 profile; identity inherited from profile

[ firmware ]
# Kernelcache from the selected OS profile (ipados-17.7.11-21H461)
kernelcache_sha256 = "f18b4df865405f2a287b84977d7aca745e056d656d9fc9df1662970ce2969de7"
kernelcache_slide  = "-0x1000000"
# Path to the compiled device tree (generated from dts/rodin.dtb)
dtb_path = "dts/rodin.dtb"
# DRAM size — 12 GiB test device; vendor DTB only reserves 1 GiB low window
dram_size = "0x300000000"
# PSCI method (confirmed from vendor DTB)
psci_method = "smc"

# UEFI-specific entries
[firmware.uefi]
entry_point = 0x0  # will be filled by the payload builder
stack_size = 0x200000  # 2 MiB temporary stack
map_firmware_volume = true

[device]
verbose = false

[components]
# Minimal set for now; UniXNU will resolve ArmCpu, ArmDTPlatform etc.
include = []
